<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .turn-indicator {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #333;
            font-weight: 300;
        }

        .turn-indicator span {
            font-weight: 600;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #e0e0e0;
            padding: 8px;
            border-radius: 12px;
        }

        .cell {
            width: clamp(100px, 25vmin, 200px);
            height: clamp(100px, 25vmin, 200px);
            background: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .cell:hover:not(.taken) {
            background: #f5f5f5;
        }

        .cell-number {
            position: absolute;
            font-size: clamp(3rem, 12vmin, 8rem);
            font-weight: 700;
            color: #e8e8e8;
            user-select: none;
            pointer-events: none;
        }

        .cell-mark {
            position: relative;
            font-size: clamp(4rem, 15vmin, 10rem);
            font-weight: 700;
            z-index: 1;
            user-select: none;
            pointer-events: none;
        }

        .cell-mark.x {
            color: #333;
        }

        .cell-mark.o {
            color: #666;
        }

        .cell.taken {
            cursor: default;
        }

        .strike-line {
            position: absolute;
            background: #ff4444;
            border-radius: 4px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .strike-line.visible {
            opacity: 1;
        }

        .board-container {
            position: relative;
        }

        .reset-btn {
            margin-top: 2rem;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .reset-btn:hover {
            background: #555;
        }

        .winner-message {
            font-size: 1.5rem;
            margin-top: 1rem;
            color: #333;
            font-weight: 500;
            min-height: 2rem;
        }
    </style>
</head>
<body>
    <div class="turn-indicator">Turn: <span id="current-turn">X</span></div>

    <div class="board-container">
        <div class="board" id="board"></div>
        <div class="strike-line" id="strike-line"></div>
    </div>

    <div class="winner-message" id="winner-message"></div>
    <button class="reset-btn" id="reset-btn">New Game</button>

    <script>
        const board = document.getElementById('board');
        const currentTurnEl = document.getElementById('current-turn');
        const winnerMessageEl = document.getElementById('winner-message');
        const strikeLine = document.getElementById('strike-line');
        const resetBtn = document.getElementById('reset-btn');

        let gameState = Array(9).fill(null);
        let currentPlayer = 'X';
        let gameOver = false;

        const winPatterns = [
            { cells: [0, 1, 2], type: 'horizontal', row: 0 },
            { cells: [3, 4, 5], type: 'horizontal', row: 1 },
            { cells: [6, 7, 8], type: 'horizontal', row: 2 },
            { cells: [0, 3, 6], type: 'vertical', col: 0 },
            { cells: [1, 4, 7], type: 'vertical', col: 1 },
            { cells: [2, 5, 8], type: 'vertical', col: 2 },
            { cells: [0, 4, 8], type: 'diagonal', dir: 'main' },
            { cells: [2, 4, 6], type: 'diagonal', dir: 'anti' }
        ];

        function createBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.innerHTML = `
                    <span class="cell-number">${i + 1}</span>
                    <span class="cell-mark"></span>
                `;
                cell.addEventListener('click', () => handleClick(i));
                board.appendChild(cell);
            }
        }

        function handleClick(index) {
            if (gameState[index] || gameOver) return;

            gameState[index] = currentPlayer;
            const cell = board.children[index];
            const mark = cell.querySelector('.cell-mark');
            mark.textContent = currentPlayer;
            mark.className = `cell-mark ${currentPlayer.toLowerCase()}`;
            cell.classList.add('taken');

            const winner = checkWinner();
            if (winner) {
                gameOver = true;
                winnerMessageEl.textContent = `${winner.player} wins!`;
                drawStrikeLine(winner.pattern);
                return;
            }

            if (gameState.every(cell => cell !== null)) {
                gameOver = true;
                winnerMessageEl.textContent = "It's a draw!";
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            currentTurnEl.textContent = currentPlayer;
        }

        function checkWinner() {
            for (const pattern of winPatterns) {
                const [a, b, c] = pattern.cells;
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    return { player: gameState[a], pattern };
                }
            }
            return null;
        }

        function drawStrikeLine(pattern) {
            const cells = board.children;
            const lineThickness = 6;
            const boardRect = board.getBoundingClientRect();

            strikeLine.style.background = '#ff4444';

            // Get cell centers relative to board
            function getCellCenter(index) {
                const cell = cells[index];
                const cellRect = cell.getBoundingClientRect();
                return {
                    x: cellRect.left - boardRect.left + cellRect.width / 2,
                    y: cellRect.top - boardRect.top + cellRect.height / 2
                };
            }

            const [startIdx, , endIdx] = pattern.cells;
            const start = getCellCenter(startIdx);
            const end = getCellCenter(endIdx);

            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const length = Math.sqrt(dx * dx + dy * dy) + 40; // extend a bit
            const angle = Math.atan2(dy, dx) * (180 / Math.PI);

            const centerX = (start.x + end.x) / 2;
            const centerY = (start.y + end.y) / 2;

            strikeLine.style.width = `${length}px`;
            strikeLine.style.height = `${lineThickness}px`;
            strikeLine.style.left = `${centerX - length / 2}px`;
            strikeLine.style.top = `${centerY - lineThickness / 2}px`;
            strikeLine.style.transformOrigin = 'center center';
            strikeLine.style.transform = `rotate(${angle}deg)`;

            strikeLine.classList.add('visible');
        }

        function resetGame() {
            gameState = Array(9).fill(null);
            currentPlayer = 'X';
            gameOver = false;
            currentTurnEl.textContent = 'X';
            winnerMessageEl.textContent = '';
            strikeLine.classList.remove('visible');
            createBoard();
        }

        resetBtn.addEventListener('click', resetGame);

        createBoard();
    </script>
</body>
</html>
